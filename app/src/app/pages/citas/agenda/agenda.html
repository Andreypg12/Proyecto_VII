<section class="agenda-page">

    <header class="agenda-header">
        <div>
            <h1>Agenda de citas</h1>

            <p>
                Consulte las citas registradas en la vista mensual o semanal.
            </p>
        </div>
    </header>

    @if (loading()) {
    <p class="loading-message">
        Cargando citas...
    </p>
    }

    @if (error()) {
    <p class="error-message">
        {{ error() }}
    </p>
    }

    <div class="status-legend">
        <span>
            <i class="status-dot pendiente"></i>
            Pendiente
        </span>

        <span>
            <i class="status-dot aceptada"></i>
            Aceptada
        </span>

        <span>
            <i class="status-dot completada"></i>
            Completada
        </span>

        <span>
            <i class="status-dot rechazada"></i>
            Rechazada
        </span>

        <span>
            <i class="status-dot cancelada"></i>
            Cancelada
        </span>
    </div>

    @if (!loading()) {
    <div class="calendar-card">
        <full-calendar [options]="calendarOptions" />
    </div>
    }

</section>
